plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    implementation "com.alphacephei:vosk:0.3.45"
    implementation "net.java.dev.jna:jna:5.7.0"
    include "com.alphacephei:vosk:0.3.45"
    include "net.java.dev.jna:jna:5.7.0"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'voicechat_api_version', project.voicechat_api_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'voicechat_api_version': project.voicechat_api_version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
